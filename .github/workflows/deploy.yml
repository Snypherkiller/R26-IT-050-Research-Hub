
name: Deploy Research Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          ls -la research-hub/
          test -f research-hub/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./research-hub

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
